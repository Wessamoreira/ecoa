<!doctype html>
<html lang="pt-BR" data-mode="adult">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ecoa — Curso de Inglês</title>
    <meta name="description" content="Curso completo de inglês do A1 ao C1 com flashcards, repetição espaçada (FSRS), pronúncia nativa e treino de fala. Para crianças, adolescentes e adultos." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F3F5FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1020" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ecoa" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <script>
      // Aplica tema e modo antes do primeiro paint (evita "piscar")
      try {
        var s = JSON.parse(localStorage.getItem('ecoa-boot') || '{}');
        var dark = s.theme === 'dark' || (s.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        if (s.mode) document.documentElement.dataset.mode = s.mode;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
